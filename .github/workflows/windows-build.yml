name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name Ytdaily --collect-all PySide6 --collect-all yt_dlp ytdaily/gui/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ytdaily-Windows
          path: dist/Ytdaily
